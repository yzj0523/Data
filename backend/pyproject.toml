[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-query-backend"
version = "0.1.0"
description = "AI query demo backend foundation"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cryptography>=44,<50",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.8,<3",
    "tzdata>=2025.2",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
